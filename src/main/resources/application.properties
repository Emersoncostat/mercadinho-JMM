spring.application.name=mercado

spring.datasource.url=jdbc:postgresql://localhost:5432/mercado
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.docker.compose.enabled=false
server.port=8082

# Acesso administrativo inicial. Em outro computador, estes valores podem ser
# substituídos pelas variáveis ADMIN_NOME, ADMIN_EMAIL e ADMIN_PASSWORD.
app.admin.nome=${ADMIN_NOME:Administrador JMM}
app.admin.email=${ADMIN_EMAIL:admin@mercadinhojmm.com}
app.admin.password=${ADMIN_PASSWORD:admin123}